services:
  postgres:
    image: postgres:17
    container_name: tiendo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - tiendo-postgres-data:/var/lib/postgresql/data

volumes:
  tiendo-postgres-data: